function mascot(m,s){return (MASCOT_MOODS[m]||MASCOT_MOODS.smile).replace('width="100" height="100"','width="'+s+'" height="'+s+'"');}
const FX=(function(){
  let ctx=null,on=true,master=null;
  try{on=localStorage.getItem('matppi-snd')!=='0';}catch(e){}
  const reduce=()=>{try{return matchMedia('(prefers-reduced-motion:reduce)').matches;}catch(e){return false;}};
  function ac(){
    if(!on)return null;
    if(!ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);}catch(e){return null;}}
    if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    return ctx;
  }
  function tone(f,t,d,type,v,f2){
    const c=ac();if(!c)return;
    const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||.15,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.03);
  }
  function noise(t,d,v){
    const c=ac();if(!c)return;
    const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
    s.buffer=b;g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(master);s.start(c.currentTime+t);
  }
  const N={C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,B5:987.77,C6:1046.5,E6:1318.5,G6:1568,C4:261.63,G4:392,E4:329.63};
  const sfx={
    tap(){tone(760,0,.05,'square',.05);},
    pop(){tone(520,0,.09,'sine',.16,980);},
    tick(i){tone(300+(i||0)*45,0,.05,'triangle',.12);},
    coin(){tone(988,0,.07,'square',.09);tone(1319,.07,.28,'square',.09);},
    win(){[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(f,i*.09,.22,'triangle',.18));tone(N.E6,.4,.5,'sine',.12);noise(0,.12,.12);},
    quest(){[N.C5,N.E5,N.G5,N.C6,N.E6].forEach((f,i)=>tone(f,i*.08,.3,'square',.08));tone(N.G6,.45,.6,'triangle',.12);},
    rank(){noise(0,.35,.3);tone(N.C4,0,.25,'sawtooth',.12);[N.G4,N.C5,N.E5,N.G5,N.C6,N.E6,N.G6].forEach((f,i)=>tone(f,.25+i*.09,.35,'square',.07));tone(N.C6,.95,.9,'triangle',.14);},
    review(){tone(1568,0,.6,'sine',.14);tone(2093,.08,.5,'sine',.07);},
    photo(){noise(0,.05,.18);tone(1200,.04,.08,'square',.06);tone(1568,.14,.45,'sine',.12);},
    trip(){tone(196,0,.45,'sawtooth',.1);tone(262,.4,.7,'sawtooth',.1);noise(.9,.25,.08);},
    oops(){tone(300,0,.18,'sawtooth',.09,200);}
  };
  function flash(color){
    if(reduce())return;const el=document.getElementById('flash');if(!el)return;
    el.style.setProperty('--fc',color||'#f2c14e');el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
  }
  function shake(){if(reduce())return;const m=document.querySelector('main');if(!m)return;m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');}
  let parts=[],raf=0;
  function confetti(n,x,y){
    if(reduce())return;const cv=document.getElementById('fxc');if(!cv)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
    const c2=cv.getContext('2d');c2.setTransform(dpr,0,0,dpr,0,0);
    const cols=['#f2c14e','#1e5bb8','#1f8a5b','#e8742c','#c0392b','#ffffff'],em=['🍚','🍜','🥢','⭐','🎉'];
    const ox=x==null?innerWidth/2:x,oy=y==null?innerHeight*.35:y;
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*7;
      parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],e:Math.random()<.18?em[i%em.length]:null,life:0});}
    if(!raf){const step=()=>{c2.clearRect(0,0,innerWidth,innerHeight);
      parts=parts.filter(p=>p.life<95&&p.y<innerHeight+20);
      parts.forEach(p=>{p.life++;p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.r+=p.vr;c2.save();c2.translate(p.x,p.y);c2.rotate(p.r);c2.globalAlpha=Math.max(0,1-p.life/95);
        if(p.e){c2.font='18px sans-serif';c2.fillText(p.e,-9,6);}else{c2.fillStyle=p.c;c2.fillRect(-4,-2.5,8,5);}c2.restore();});
      if(parts.length)raf=requestAnimationFrame(step);else{raf=0;c2.clearRect(0,0,innerWidth,innerHeight);}};raf=requestAnimationFrame(step);}
  }
  function floatXP(n){
    if(reduce())return;const h=document.getElementById('xpFill');if(!h)return;const r=h.getBoundingClientRect();
    const d=document.createElement('div');d.className='xpfloat';d.textContent='+'+n+' XP';d.style.left=Math.max(8,r.left+r.width/2-30)+'px';d.style.top=(r.top+window.scrollY>0?r.top:60)+'px';
    document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
    ['rankName','stTotal','stToday'].forEach(id=>{const e=document.getElementById(id);if(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}});
  }
  return {
    sfx:(k,a)=>{try{if(sfx[k])sfx[k](a);}catch(e){}},
    isOn:()=>on,
    set(v){on=v;try{localStorage.setItem('matppi-snd',v?'1':'0');}catch(e){}if(v)sfx.coin();},
    flash,shake,confetti,floatXP,
    celebrate(kind){
      if(kind==='checkin'){sfx.coin();flash('#f2c14e');confetti(26);}
      else if(kind==='quest'){sfx.quest();flash('#5fd39c');confetti(70);}
      else if(kind==='rank'){sfx.rank();flash('#ffe9b0');shake();confetti(160);}
      else if(kind==='win'){sfx.win();flash('#e8742c');confetti(60);}
      else if(kind==='review'){sfx.review();flash('#1e5bb8');confetti(28);}
      else if(kind==='photo'){sfx.photo();flash('#ffffff');confetti(60);}
      else if(kind==='trip'){sfx.trip();flash('#e8742c');}
    }
  };
})();

const cleanDish=s=>String(s||'').replace(/\n/g,' · ').replace(/\*/g,'·').replace(/\[[^\]]*\]/g,'').replace(/^NEW\s*/,'').replace(/^&\s*/,'').trim();
const mainOf=s=>cleanDish(s).split('&')[0].replace(/\(.*?\)/g,'').trim();
function menuOth(date,meal,bld){
  if(!OTH)return null;
  const dow=(parse(date).getDay()+6)%7;if(dow>4)return null;
  const ref=addDays(OTH.weeks[0],dow);
  const rs=OTH.rows.filter(r=>r[0]===bld&&r[1]===ref&&r[2]===meal);
  if(!rs.length)return null;
  return {src:'ref',ref,slots:rs.map(r=>({k:r[3],p:r[4],d:[r[5]].concat(r[6]?[r[6]]:[])}))};

function regionList(r,g){return DB.filter(e=>e.r===r&&(!g||e.g===g));}
function jitter(k){return (hashStr(ymd()+k)%100)/100*0.9;}
function ratingBonus(e){const o=REVMAP[skey(e)];return o?o.sum/o.n*0.3:0;}
function recommend(o){
  const out=[];
  regionList(o.r,o.g).forEach(e=>{
    let s=0,why='';
    if(o.kw){const t=stxt(e);const h=o.kw.filter(k=>t.includes(k));if(!h.length)return;s+=h.length*2;why=h.slice(0,2).join('·');}
    if(o.sit){const x=sitScore(e,o.sit);if(!x)return;s+=x.s;why=x.why;}
    if(o.max){const p=minPrice(e);if(p===null||p>o.max)return;}
    s+=(e.t.includes('B')?1:0)+(e.t.includes('A')?.5:0)+(e.t.includes('G')?.5:0)+(e.m.length?.3:0)+ratingBonus(e)+jitter(skey(e));
    out.push({e,s,why});
  });
  out.sort((a,b)=>b.s-a.s);
  return out;
}

function fillGun(){
  const gs=[...(GUN[ST.ex.r]||[])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));
  $('#ex-gun').innerHTML='<option value="">전체 시군구</option>'+gs.map(s=>`<option>${esc(s)}</option>`).join('');
  $('#ex-gun').value=ST.ex.g||'';
}
function exFilter(){
  const x=ST.ex,q=x.q.toLowerCase();
  let a=[];
  regionList(x.r,x.g).forEach(e=>{
    if(x.tags.size&&![...x.tags].every(t=>e.t.includes(t)))return;
    if(x.cat&&e.c!==x.cat)return;
    if(x.fav&&!S.fav[skey(e)])return;
    if(x.max){const p=minPrice(e);if(p===null||p>x.max)return;}
    if(q&&!(e.n+' '+e.a+' '+e.m.map(m=>m[0]).join(' ')).toLowerCase().includes(q))return;
    let s=0,why='';
    if(x.sit){const r=sitScore(e,x.sit);if(!r)return;s=r.s;why=r.why;}
    s+=(e.t.length)+(e.m.length?.3:0)+ratingBonus(e)+jitter(skey(e));
    a.push({e,s,why});
  });
  if(x.sort==='price')a.sort((p,q)=>(minPrice(p.e)??1e9)-(minPrice(q.e)??1e9));
  else if(x.sort==='name')a.sort((p,q)=>p.e.n.localeCompare(q.e.n,'ko'));
  else a.sort((p,q)=>q.s-p.s);
  return a;
}
function renderExploreList(keep){
  if(!$('#ex-list'))return;
  const a=exFilter();ST.exList=a;
  $('#ex-cnt').textContent=`${ST.ex.r}${ST.ex.g?' '+ST.ex.g:''} · 조건에 맞는 업소 ${a.length.toLocaleString()}곳`;

  $('#ex-more').style.display=a.length>ST.ex.shown?'block':'none';
  $$('[data-act=meal]',$('#p-explore')).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ST.meal));
  $$('[data-act=exsit]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ST.ex.sit));
}

}

const SIDO_ALIAS={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주·전남','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','강원도':'강원','충청북도':'충북','충청남도':'충남','전북특별자치도':'전북','전라북도':'전북','전라남도':'광주·전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주','광주':'광주·전남','전남':'광주·전남'};
function parseTripText(txt){
  const o={};const ds=[...txt.matchAll(/(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/g)].map(m=>m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]));
  if(ds[0]){o.from=ds[0];o.to=ds[1]&&ds[1]>=ds[0]?ds[1]:ds[0];}
  const hub=HUBS.filter(h=>txt.includes(h.n.replace(/\(.*\)/,''))).sort((a,b)=>b.n.length-a.n.length)[0];
  let best=null;
  Object.keys(SIDO_ALIAS).concat(SIDO).forEach(k=>{const i=txt.indexOf(k);if(i>=0&&(!best||i<best.i||(i===best.i&&k.length>best.k.length)))best={i,k};});
  o.r=best?(SIDO_ALIAS[best.k]||best.k):hub?hub.r:null;
  if(!o.r){for(const r of SIDO){const g=[...(GUN[r]||[])].find(g=>g&&g.length>=2&&txt.includes(g));if(g){o.r=r;o.g=g;break;}}}
  else{const g=[...(GUN[o.r]||[])].filter(g=>g&&txt.includes(g)).sort((a,b)=>b.length-a.length)[0];if(g)o.g=g;}
  if(hub){o.hub=hub.n;o.mode=hub.k==='rail'?'ktx':hub.k;}
  const kw=[['audit',/점검|감사|지도/],['site',/현장|방문|실사/],['event',/행사|교육|세미나|워크숍|설명회|포럼/],['meet',/회의|협의|간담회|면담/]].find(x=>x[1].test(txt));
  if(kw)o.kind=kw[0];
  const tm=[...txt.matchAll(/(\d{1,2}):(\d{2})/g)];if(tm[0])o.arr=pad(+tm[0][1])+':'+tm[0][2];
  let note=txt.split(/\n/).map(x=>x.trim()).filter(Boolean)[0]||'';
  if(hub)note=note.split(hub.n.replace(/\(.*\)/,'')).join(' ');
  note=note.replace(/\d{1,2}\s*:\s*\d{2}/g,' ');
  note=note.replace(/(20\d{2})\s*[.\-/년]\s*\d{1,2}\s*[.\-/월]\s*\d{1,2}\s*일?/g,'').replace(/출장\s*기간|기간|출장지|[:~()\[\]]/g,' ');
  Object.keys(SIDO_ALIAS).concat(SIDO,o.g?[o.g]:[],hub?[hub.n.replace(/\(.*\)/,''),hub.n]:[]).forEach(k=>{if(k)note=note.split(k).join(' ');});
  note=note.replace(/\d{1,2}\s*:\s*\d{2}/g,' ').replace(/\s(도착|출발|예정)(?=\s|$)/g,' ');
  note=note.replace(/\s+/g,' ').trim().slice(0,40);if(note.length>=2)o.note=note;
  return o;
}

     toast(n.kind==='audit'?'점검·감사 출장 등록! 청렴 한 끼 퀘스트가 열립니다.':'출장을 등록했어요. 식사 동선표를 확인해 보세요.');FX.celebrate('trip');say(n.kind==='audit'?'tclean':'trip');refreshAll();

function pickDaily(day){
  let h=hashStr(day);const pool=DAILY.slice(),out=[];
  while(out.length<4){h=(Math.imul(h,1103515245)+12345)>>>0;out.push(pool.splice(h%pool.length,1)[0]);}
  if(tripOn(day))out[3]=TRIPQ;
  {const tq=tripOn(day);if(tq&&tq.kind==='audit')out[2]=CLEANQ;}
  return out;
}
function questSet(){
  const day=ymd(),ws=weekStart(),dl=S.log.filter(l=>l.d===day),wl=S.log.filter(l=>l.d>=ws);
  return [...pickDaily(day).map(q=>({q,scope:'일일',key:q.id+'@'+day,p:q.c(dl,day)})),
    ...WEEKLY.map(q=>({q,scope:'주간',key:q.id+'@'+ws,p:q.c(wl,ws)})),
    ...CAREER.map(q=>({q,scope:'경력',key:q.id,p:q.c(S.log)}))];
}

}

function wheelSVG(items){
  const N=items.length,R=140,cx=150,cy=150;if(N<2)return '';

 {k:'trip',n:'출장 맛삐',tag:'서기관',d:'캐리어를 끌고 전국을 다닙니다. 출장지 안심식당·착한가격업소를 먼저 찾아둡니다.'},

const skinIdx=k=>Math.max(0,SKINS.findIndex(s=>s.k===k));
function skinSVG(k,size){return (SKIN_SVG[k]||SKIN_SVG.base).replace('width="100" height="100"','width="'+size+'" height="'+size+'"');}
function skinUnlocked(i){return rankOf(xpTotal())>=i;}
function curSkin(){const k=S.skin||'base';return skinUnlocked(skinIdx(k))?k:'base';}
function applySkin(){const el=document.querySelector('.brand>svg,.brand>.hdrm');if(!el)return;const w=document.createElement('span');w.className='hdrm';w.title=SKINS[skinIdx(curSkin())].n;w.innerHTML=skinSVG(curSkin(),50);el.replaceWith(w);}
function cameo(){
  const t=ymd();if(tripOn(t)&&skinUnlocked(2))return {k:'trip',why:'출장 모드'};
  let txt='';try{const mn=menuFor(t,autoMeal());txt=mn?mn.slots.map(s=>s.d.join(' ')).join(' '):'';}catch(e){}
  if(/돈까스|돈가스|카츠/.test(txt))return {k:'katsu',why:'오늘 돈까스 출현'};
  if(/김밥/.test(txt))return {k:'gimbap',why:'오늘 김밥 출현'};
  if(/비빔/.test(txt))return {k:'bibim',why:'오늘 비빔밥 출현'};
  return {k:curSkin(),why:''};}
function rankUnlockMsg(r){return '🎖 승진! '+RANKS[r][1]+' 직급이 되었습니다.'+(SKINS[r]?' 새 캐릭터 「'+SKINS[r].n+'」 해금!':'');}
function onRankUp(r){say('rankup',1400);if(SKINS[r]){S.skin=SKINS[r].k;save();applySkin();}}
function dexHTML(){
  const r=rankOf(xpTotal()),cur=curSkin();
  return `<div class="sec" style="margin-top:0">🧸 맛삐 도감 <small>${Math.min(r+1,SKINS.length)} / ${SKINS.length} 해금 · 직급이 오르면 새 맛삐가 열립니다</small></div>
  <details class="card dexinfo"><summary>맛삐는 누구인가요?</summary>
   <div class="dexwho">${skinSVG('base',84)}<div><b>맛삐</b> · 맛집비서<br>국민비서 ‘구삐’처럼 먼저 챙겨 주는 점심 비서입니다. 이름은 <b>맛집</b> + <b>비서</b>.<br>
   <span class="mute">밥그릇 헬멧 = 매일의 한 끼 · 헤드셋 = 먼저 알려 주는 비서 · 숟가락 = 바로 먹으러 가자 · 김 두 줄기 = 갓 지은 따뜻함</span></div></div>
   <div class="mute" style="margin-top:6px">좋아하는 것: 착한가격 한 끼, 동료와 함께하는 점심 · 싫어하는 것: 점심 굶고 야근하기</div></details>
  <div class="dex">${SKINS.map((s,i)=>{const on=i<=r;return `<div class="card dexc ${on?'on':'lock'} ${s.k===cur?'sel':''}">
    <div class="dexi">${skinSVG(s.k,92)}</div><h4>${on?esc(s.n):'???'}</h4><div class="dext">${esc(s.tag)}${on?'':' 달성 시 해금'}</div>
    ${on?`<p>${esc(s.d)}</p>${s.k===cur?'<span class="dexb">대표 캐릭터</span>':`<button class="btn ghost sm" data-act="skin" data-v="${s.k}">대표로 설정</button>`}`:`<p>🔒 ${RANKS[i][0]-xpTotal()} XP 남음</p>`}</div>`;}).join('')}</div>`;}

const RTN=Object.fromEntries(RTAGS);
let rvFilter='';
function renderReviews(){
  const root=$('#p-review');if(!root)return;
  buildRevMap();
  let a=allRevs();

function resizeImage(file,max,q){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',q);};
  img.onerror=()=>rej(new Error('img'));img.src=url;});}

/* ---------- 취향(좋아요·싫어요) + 구내식당 뽑기 ---------- */
const PALIAS={'돈까스':['돈까스','돈가스','까스','커틀릿'],'라면':['라면','라멘'],'짜장':['짜장','자장'],'탕수육':['탕수'],'매운맛':['매운','얼큰','마라','청양','불닭','핫','화끈','불맛'],'마라':['마라'],'국물':['국','탕','찌개','전골'],'닭고기':['닭','치킨','찜닭','닭갈비','삼계'],'돼지고기':['돈육','제육','삼겹','돼지','돈','수육','보쌈'],'소고기':['소고기','불고기','한우','우삼','우육','차돌','쇠고기'],'생선':['생선','고등어','갈치','조기','가자미','연어','명태','동태','코다리','북어','황태'],'해산물':['해물','새우','오징어','낙지','주꾸미','조개','바지락','어묵'],'내장':['내장','곱창','순대','막창','선지','양대창'],'버섯':['버섯','느타리','표고','팽이'],'가지':['가지'],'오이':['오이'],'고수':['고수'],'파스타':['파스타','스파게티','리조또','뇨끼'],'면':['면','국수','우동','라면','짬뽕','소바','냉면']};
const termWords=k=>{k=String(k).trim();const a=PALIAS[k];return a?a:[k];};
const PSUG_L=['돈까스','칼국수','제육','치킨','비빔밥','찌개','짜장','파스타'];
const PSUG_D=['오이','고수','마라','내장','가지','버섯','생선','매운맛'];
const normP=t=>t.replace(/\s+/g,'');
function prefHits(list,text){return list.filter(k=>termWords(k).some(w=>text.includes(w)));}
const slotText=sl=>cleanDish(sl.d.join(' '));
function bldEval(b,date,meal){
  const mn=menuFor(date,meal,b);if(!mn||!mn.slots.length)return null;
  const L=S.prefs.likes,D=S.prefs.dislikes;
  const slots=mn.slots.map(sl=>{const t=slotText(sl);const lh=prefHits(L,t),dh=prefHits(D,t);const ex=lh.filter(k=>t.includes(k));return {sl,lh,ex,dh,sc:ex.length*3+(lh.length-ex.length)*2-dh.length*6};});
  const best=slots.slice().sort((a,b)=>b.sc-a.sc||(a.sl.p||0)-(b.sl.p||0))[0];
  const allBad=slots.every(x=>x.dh.length);
  const likeSlots=slots.filter(x=>x.lh.length).length;
  const warnOthers=slots.filter(x=>x!==best&&x.dh.length).length;
  return {b,mn,slots,best,score:best.sc+likeSlots*0.5-(allBad?3:0),allBad,warnOthers};
}
function drawWeights(evs){return evs.map(e=>Math.exp(Math.max(-6,Math.min(8,e.score))/1.3)*(e.allBad?0.05:1));}
function pickBld(evs){
  const w=drawWeights(evs),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<evs.length;i++){r-=w[i];if(r<=0)return evs[i];}return evs[evs.length-1];
}
const prefMark=text=>{const lh=prefHits(S.prefs.likes,text),dh=prefHits(S.prefs.dislikes,text);return (lh.length?`<span class="mk" title="${esc(lh.join(', '))}">❤️</span>`:'')+(dh.length?`<span class="mk" title="${esc(dh.join(', '))}">⚠️</span>`:'');};

let DRAW_BUSY=false;
function drawOpen(){
  if(DRAW_BUSY||!MENU||!OTH)return;
  const date=ST.date,meal=ST.meal;
  const evs=BLDS.map(b=>bldEval(b,date,meal)).filter(Boolean);
  const box=$('#qbox');$('#qwin').classList.add('on');
  if(!evs.length){box.innerHTML=`<button class="x" data-act="qclose">×</button><span class="tag">[ 구내식당 추첨 ]</span><h2>후보가 없습니다</h2><div class="ln">${md(date)} ${MNAME[meal]}은(는) 식단 정보가 있는 식당이 없습니다. 다른 날짜나 끼니를 골라 보세요.</div><div class="bt"><button data-act="qclose">닫기</button></div>`;return;}
  const win=pickBld(evs);
  const names=BLDS.map(b=>bldName(b));
  const fin=()=>drawReveal(win,evs);
  const reduce=(()=>{try{return matchMedia('(prefers-reduced-motion:reduce)').matches;}catch(e){return false;}})();
  if(reduce){fin();return;}
  DRAW_BUSY=true;
  box.innerHTML=`<span class="tag">[ 구내식당 추첨 중 ]</span><h2>${md(date)} ${MNAME[meal]} · 오늘의 한 곳</h2>
   <div class="ph">❤️ ${esc(S.prefs.likes.join(' · ')||'취향 미입력')} &nbsp; 🚫 ${esc(S.prefs.dislikes.join(' · ')||'없음')}</div>
   <div class="reel spin" id="reel">?</div><div class="ph" id="rph">후보 ${evs.length}곳 분석 중…</div>`;
  FX.sfx('rank');
  const seq=[];const total=24;for(let i=0;i<total;i++){seq.push(i<total-1?evs[(i*7+3)%evs.length]:win);}
  let i=0;
  const step=()=>{
    const e=seq[i];const el=$('#reel');if(!el){DRAW_BUSY=false;return;}
    el.textContent=bldName(e.b);FX.sfx('tick',i%12);
    if(i%6===5)$('#rph').textContent=['취향 대조 중…','기피 음식 걸러내는 중…','메뉴 점수 계산 중…','거의 다 왔습니다…'][Math.min(3,Math.floor(i/6))];
    i++;
    if(i>=total){el.classList.remove('spin');DRAW_BUSY=false;setTimeout(fin,350);return;}
    setTimeout(step,45+Math.pow(i/total,3)*520);
  };
  step();
}
function drawReveal(e,evs){
  const sl=e.best.sl,tx=slotText(sl);
  const rank=evs.slice().sort((a,b)=>b.score-a.score).findIndex(x=>x.b===e.b)+1;
  const hits=e.best.lh.map(k=>`<span class="hit">❤️ ${esc(k)}${e.best.ex.includes(k)?'':' 계열'}</span>`).join('');
  const warn=e.best.dh.map(k=>`<span class="hit warn">⚠️ ${esc(k)} 포함</span>`).join('');
  const none=(!hits&&!warn)?`<span class="hit no">${S.prefs.likes.length?'좋아하는 음식은 없지만 ':''}기피 음식도 없어요</span>`:'';
  const safe=(!warn&&S.prefs.dislikes.length)?`<span class="hit no">🚫 기피 음식 없음(메뉴명 기준)</span>`:'';
  const ref=e.mn.src==='ref';
  const others=e.slots.filter(x=>x!==e.best).map(x=>`<div class="rw"><span>· ${esc(x.sl.k)} ${esc(cleanDish(x.sl.d[0]))}${x.dh.length?' ⚠️':''}${x.lh.length?' ❤️':''}</span><span>${x.sl.p?won(x.sl.p):''}</span></div>`).join('');
  $('#qbox').innerHTML=`<button class="x" data-act="qclose" aria-label="닫기">×</button><span class="mscot" style="float:right;margin:-4px 28px 0 0">${mascot(e.best.dh.length?"sad":"wow",54)}</span><span class="tag">[ 추첨 결과 ]</span>
   <div class="ph" style="margin-top:8px">${md(ST.date)} ${MNAME[ST.meal]} · 후보 ${evs.length}곳 중 취향 적합도 ${rank}위</div>
   <div class="pickname">${esc(bldName(e.b))}${e.b===S.bld?' (내 식당)':''}</div>
   <div class="ln"><b>${esc(sl.k)}</b> ${sl.p?'· '+won(sl.p):''}<br>${esc(cleanDish(sl.d[0]))}${sl.d[1]?' · '+esc(cleanDish(sl.d.slice(1,4).join(' · '))):''}</div>
   <div>${hits}${warn}${safe}${none}</div>
   ${others?`<div class="box"><div class="rw"><span>이 식당의 다른 코스</span><span></span></div>${others}</div>`:''}
   ${ref?`<div class="ln" style="font-size:12px;color:#9fd8ff">※ ${md(e.mn.ref)} 주 식단 기준 참고용입니다. 방문 전 게시판 확인!</div>`:''}
   <div class="bt" style="margin-top:10px"><button class="y" data-act="drawgo" data-v="${e.b}">여기로 갈래요</button><button data-act="drawagain">🎰 다시 뽑기</button></div>`;
  if(e.best.dh.length){FX.sfx('oops');FX.shake();FX.flash('#ff8a7a');say('dislike',500);}else{FX.celebrate('win');say('draw',500);}
  if(e.best.lh.length)setTimeout(()=>FX.celebrate('quest'),500);
}

function voteCands(){
  if(!HSTAT)return [];
  return Object.entries(HSTAT.cnt).filter(([k,n])=>k&&n>=4).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).slice(0,24).map(([k,n])=>({k,n}));
}
function voteTally(){
  const t={};const add=(k,v)=>{const o=t[k]=t[k]||{lg:0,bd:0};if(v>0)o.lg++;else if(v<0)o.bd++;};
  const seen=new Set();
  SHARED_VOTES.forEach(r=>{if(!r||!r.m)return;seen.add(r.uid+'|'+r.m);add(r.m,+r.v);});
  Object.entries(S.votes||{}).forEach(([k,v])=>{if(!seen.has(UID+'|'+k))add(k,v);});
  if(S.demo){voteCands().forEach(({k,n})=>{const h=hashStr('v'+k);const o=t[k]=t[k]||{lg:0,bd:0};o.lg+=(h%13)+Math.round(n/2);o.bd+=((h>>5)%11);});
    const bad=['명태','동태','코다리','가자미','두부조림','어묵'];voteCands().forEach(({k})=>{if(bad.some(b=>k.includes(b)))t[k].bd+=9;});}
  return t;
}

async function castVote(m,v){
  const cur=S.votes[m]||0,nv=cur===v?0:v;
  if(nv)S.votes[m]=nv;else delete S.votes[m];save();
  if(nv>0){FX.sfx('coin');FX.flash('#f2c14e');FX.confetti(24);toast('👑 전설 한 표! '+m);say('vote');}
  else if(nv<0){FX.sfx('oops');FX.shake();toast('💀 악명 한 표… '+m);say('vote');}
  else{FX.sfx('tap');toast('투표를 취소했어요.');}
  renderVote();
  if(DBH){try{const id=('v_'+UID+'_'+m).replace(/[^\w가-힣]/g,'_');const ref=DBH.collection('votes').doc(id);if(nv)await ref.set({m,v:nv,uid:UID,ts:Date.now()});else await ref.delete();}catch(e){}}
}
