<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛삐 – 오늘 뭐 먹지? 구내식당·외식·출장 맛집비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2a5b; --blue:#1e5bb8; --sky:#e8f0fb; --gold:#b8892b; --goldbg:#fbf3df;
  --green:#1f8a5b; --greenbg:#e3f4ec; --ink:#1c2433; --mute:#667085; --line:#d9e0ec;
  --bg:#f3f5f9; --card:#fff; --red:#c0392b; --orange:#e8742c; --orangebg:#fff0e4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
.top{background:var(--navy);color:#fff}
.top .in{max-width:1000px;margin:0 auto;padding:16px 16px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.eyebrow{font-size:11px;letter-spacing:.08em;opacity:.75}
h1{font-size:22px;margin:0;font-weight:900;line-height:1.2}
h1 small{font-size:13px;font-weight:500;opacity:.8;margin-left:6px}
#demoBar{background:#fff7dd;color:#5a4300;border:1px solid #e8c766;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#demoBar b{color:#0b2a5b}#demoBar button{margin-left:auto;border:1px solid #c79a1d;background:#fff;color:#5a4300;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
#qwin{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 40%,#0a2a5ecc,#020a1aee)}
#qwin.on{display:flex}
#qwin .sys{position:relative;width:100%;max-width:400px;background:linear-gradient(180deg,#0d2c63f2,#06173af2);border:1.5px solid #6fd3ff;border-radius:10px;box-shadow:0 0 0 1px #6fd3ff44,0 0 28px #3fb4ffaa,inset 0 0 26px #3fb4ff33;color:#e6f6ff;padding:16px 16px 14px;animation:qin .45s cubic-bezier(.2,1.4,.4,1)}
#qwin .sys:before{content:"";position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(0deg,#ffffff07 0 2px,transparent 2px 4px);pointer-events:none}
#qwin .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#06173a;background:#6fd3ff;border-radius:3px;padding:3px 8px;animation:blink 1.2s steps(2) infinite}
#qwin h2{margin:10px 0 2px;font-size:21px;color:#fff;text-shadow:0 0 10px #6fd3ffaa}
#qwin .ln{font-size:14px;line-height:1.55;margin:8px 0;color:#cfeaff}
#qwin .ln b{color:#ffe08a}
#qwin .box{border:1px dashed #6fd3ff88;border-radius:6px;padding:10px 12px;margin:10px 0;background:#ffffff0a}
#qwin .rw{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
#qwin .rw span:last-child{color:#ffe08a;font-weight:800}
#qwin .q{font-size:15px;font-weight:700;margin:12px 0 10px;color:#fff}
#qwin .bt{display:flex;gap:8px;flex-wrap:wrap}
#qwin .bt button{flex:1;min-width:110px;padding:10px 8px;border-radius:6px;font-weight:800;font-size:14px;cursor:pointer;border:1.5px solid #6fd3ff;background:#6fd3ff22;color:#e6f6ff}
#qwin .bt button.y{background:#6fd3ff;color:#06173a;box-shadow:0 0 14px #6fd3ffaa}
#qwin .x{position:absolute;right:10px;top:8px;background:none;border:0;color:#9fd8ff;font-size:20px;cursor:pointer}
@keyframes qin{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.55}}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.vt .card h4{margin:0 0 8px;font-size:15px}
.vt ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
.vt ol small{color:var(--mute)}
.vrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .nm{flex:1;font-weight:700;font-size:14.5px}
.vrow .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.vbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.vbtn[aria-pressed=true].lg{background:#f2c14e;border-color:#c79a1d;color:#3a2a00}
.vbtn[aria-pressed=true].bd{background:#3b3f4a;border-color:#3b3f4a;color:#fff}
@media (max-width:560px){.vt{grid-template-columns:1fr}}
#qwin .reel{margin:14px 0 6px;text-align:center;font-size:30px;font-weight:900;color:#fff;letter-spacing:.02em;text-shadow:0 0 14px #6fd3ff;min-height:46px}
#qwin .reel.spin{animation:rp .09s linear infinite}
@keyframes rp{50%{opacity:.7;transform:translateY(-2px)}}
#qwin .ph{font-size:12.5px;color:#9fd8ff;text-align:center}
#qwin .hit{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#ffe08a;color:#3a2a00}
#qwin .hit.no{background:#ffffff22;color:#cfeaff;font-weight:600}
#qwin .hit.warn{background:#ff8a7a;color:#3a0a00}
#qwin .pickname{font-size:24px;font-weight:900;color:#ffe08a;margin:2px 0 6px;text-shadow:0 0 12px #ffcf4a99}
.pf{display:grid;gap:10px;margin-bottom:12px}
.pf .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pf h4{margin:0 0 6px;font-size:14px}
.pf input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;background:#fff}
.pc{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 6px 5px 11px;font-size:13px;font-weight:700}
.pc.l{background:#fdecc0;color:#5a4300;border:1px solid #e8c766}
.pc.d{background:#e9ebf0;color:#3b3f4a;border:1px solid #c4c8d2}
.pc button{border:0;background:none;font-size:15px;cursor:pointer;color:inherit;opacity:.7;padding:0 4px}
.sg{border:1px dashed var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mute);cursor:pointer}
.sg.on{opacity:.4}
.dish .mk{font-size:12px;margin-left:4px}
.shop.likeb{border:2px solid #e0b43a}.shop.warnb{opacity:.9}
.bigdraw{width:100%;font-size:17px;padding:14px;border-radius:12px;background:linear-gradient(90deg,#e8742c,#f2a93c);color:#fff;border:0;font-weight:900;cursor:pointer;box-shadow:0 4px 14px #e8742c55;letter-spacing:.02em}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#0f3677;border-radius:12px;padding:12px 14px;margin:12px 0 12px}
.rank{font-size:12px;opacity:.8}
.rank b{display:block;font-size:20px;font-weight:900;opacity:1;color:#ffe9b0}
.xpbar{height:8px;background:#ffffff26;border-radius:8px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#ffe9b0)}
.xpt{font-size:11px;opacity:.8;margin-top:3px}
.stats{display:flex;gap:14px;text-align:center}
.stats div{font-size:11px;opacity:.9}
.stats b{display:block;font-size:20px;font-weight:900}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:#ffffffb3;padding:10px 14px;font-weight:700;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tab[aria-selected=true]{background:var(--bg);color:var(--navy)}
main{max-width:1000px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--mute);font-weight:700;min-width:44px}
select,input[type=search],input[type=number],input[type=date],input[type=text],textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
input[type=search],input[type=text]{flex:1;min-width:140px}
textarea{width:100%;resize:vertical}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.chip[aria-pressed=true],.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--blue);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #f2c14e;outline-offset:1px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-size:13px;color:var(--mute);gap:8px;flex-wrap:wrap}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.shop{display:flex;flex-direction:column;gap:6px}
.shop h3{margin:0;font-size:16px;font-weight:700}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.b{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.b.A{background:var(--greenbg);color:var(--green)}
.b.G{background:var(--sky);color:var(--blue)}
.b.B{background:var(--goldbg);color:var(--gold)}
.b.cat{background:#eef0f4;color:var(--mute)}
.b.why{background:var(--orangebg);color:var(--orange)}
.addr{font-size:12.5px;color:var(--mute)}
.menus{font-size:13px;margin:0;padding:0;list-style:none}
.menus li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
.menus li span:last-child{font-weight:700;white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.star{font-size:12px;color:var(--gold);font-weight:700}
.thumb{width:100%;max-height:120px;object-fit:cover;border-radius:8px}
.pick{border:2px solid var(--gold);background:var(--goldbg);margin:10px 0}
.pick .t{font-size:12px;color:var(--gold);font-weight:900;letter-spacing:.04em;margin-bottom:6px}
.sec{margin:18px 0 8px;font-size:15px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec small{font-weight:500;color:var(--mute);font-size:12px}
.bubble{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.bubble .msg{font-size:14px}
.bubble .msg b{color:var(--blue)}
.who{font-size:12px;font-weight:900;color:var(--navy);margin-bottom:2px}
.trip{background:var(--orangebg);border:1px solid #f6c9a6;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.trip b{color:var(--orange)}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.days .chip{flex:none;text-align:center;line-height:1.25;padding:6px 12px}
.days .chip small{display:block;font-size:11px;opacity:.75}
.slot{border-top:1px dashed var(--line);padding:8px 0}
.slot:first-child{border-top:0}
.slot h4{margin:0 0 3px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.slot h4 span{color:var(--gold);font-weight:900;font-size:13px}
.dish{font-size:13px;color:var(--ink)}
.dish b{font-size:15px}
.dish .sub{color:var(--mute)}
.hist{font-size:12px;color:var(--mute);margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.bar i{display:block;height:10px;background:var(--blue);border-radius:6px}
.bar span:first-child{min-width:104px}
.quest{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.quest h4{margin:0;font-size:15px}
.quest p{margin:2px 0 6px;font-size:12.5px;color:var(--mute)}
.pbar{height:7px;background:#e5e9f1;border-radius:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue)}
.quest.done .pbar i{background:var(--green)}
.xp{font-weight:900;color:var(--gold);font-size:13px;text-align:right}
.pc{font-size:11px;color:var(--mute);margin-top:3px}
.hdrm{display:inline-flex;flex:none}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.dexc{text-align:center;padding:12px 10px}
.dexc h4{margin:4px 0 2px;font-size:14px}.dexc p{margin:4px 0 8px;font-size:12px;color:var(--mute);line-height:1.45}
.dext{font-size:11.5px;color:#1e5bb8;font-weight:700}
.dexc.lock .dexi svg{filter:brightness(0);opacity:.18}.dexc.lock{background:#f5f7fb}
.dexc.sel{border-color:var(--gold);background:var(--goldbg)}
.dexb{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold);color:#3b2a00}
.dexc.on .dexi svg{animation:bob 2.8s ease-in-out infinite}
.dexinfo{margin-bottom:10px}.dexinfo summary{cursor:pointer;font-weight:700}.dexwho{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:13px;line-height:1.55}.dexwho svg{flex:none}
.dexinfo .mute,.dexwho .mute{color:var(--mute);font-size:12px}
.bubble .cam{color:var(--mute);font-weight:600}
.wrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.wrow input{flex:1;min-width:120px}
.wbox{position:relative;max-width:340px;margin:6px auto 0}
.wsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(11,42,91,.18))}
#wrot{transform-origin:150px 150px;transform-box:view-box}
.wptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #e8742c;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.wgo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:4px solid #0b2a5b;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:12px;color:#0b2a5b}
.wgo svg{width:62%;height:auto;margin-top:-4px}.wgo b{margin-top:-6px}.wgo:disabled{opacity:.5}
.wsk{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--mute);margin:8px auto 0;max-width:420px}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wit{display:inline-flex;align-items:center;gap:4px;padding:5px 4px 5px 10px;border-radius:99px;background:#eef3fc;font-size:13px;font-weight:700;color:#0b2a5b}
.wit small{font-weight:500;color:var(--mute);font-size:11px}.wit.bad{background:#fff0ec}
.wit button{border:0;background:transparent;font-size:16px;line-height:1;width:24px;height:24px;border-radius:50%;cursor:pointer;color:#667085}
.wit button:hover{background:#dbe5f7}
.pickname.wbig{font-size:38px}
.vbtn{border:0;background:#eef3fc;border-radius:99px;font-size:12px;padding:2px 7px;cursor:pointer;vertical-align:1px}.vbtn:hover{background:#dbe5f7}
.srclink{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;color:#1e5bb8;text-decoration:none;border-bottom:1px dashed #9fb3d6}.srclink:hover{border-bottom-style:solid}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.badge{text-align:center;padding:14px 10px}
.badge .ic{font-size:30px;filter:grayscale(1);opacity:.35}
.badge.on .ic{filter:none;opacity:1}
.badge h4{margin:4px 0 2px;font-size:14px}
.badge p{margin:0;font-size:12px;color:var(--mute)}
.badge.on{border-color:var(--gold);background:var(--goldbg)}
.log{font-size:13px;display:grid;gap:4px;margin:0;padding:0;list-style:none}
.log li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0}
.rv{display:grid;gap:6px}
.rv .h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.rv .t{font-size:14px}
.rv .tg{display:flex;gap:4px;flex-wrap:wrap}
.rv .tg span{font-size:11px;background:#eef0f4;color:var(--mute);padding:2px 8px;border-radius:999px}
.note{font-size:12px;color:var(--mute);margin-top:22px;padding-top:12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.dlg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:16px;overflow:auto}
.dlg.on{display:flex}
.dlg .card{max-width:420px;width:100%;max-height:92vh;overflow:auto}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:28px;color:#cfd6e4;padding:0}
.stars button.on{color:#f2b01e}
.empty{padding:24px;text-align:center;color:var(--mute)}
details.card>summary{cursor:pointer;font-weight:900;color:var(--navy)}
@media (max-width:560px){h1{font-size:19px}.hero{grid-template-columns:1fr}.stats{justify-content:space-around}}
@media (prefers-reduced-motion:reduce){.dexc.on .dexi svg{animation:none!important}*{transition:none!important}}

/* ---- FX ---- */
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;box-shadow:inset 0 0 120px 30px var(--fc,#f2c14e);background:radial-gradient(circle at 50% 40%,var(--fc,#f2c14e)33,transparent 65%)}
.flash.go{animation:flashgo .7s ease-out}
@keyframes flashgo{0%{opacity:0}18%{opacity:.85}100%{opacity:0}}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:41;width:100%;height:100%}
.shake{animation:shk .5s ease-in-out}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-.4deg)}40%{transform:translateX(5px) rotate(.4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.xpfloat{position:fixed;z-index:42;pointer-events:none;font-weight:900;font-size:22px;color:#ffe9b0;text-shadow:0 2px 6px #0b2a5bcc,0 0 14px #f2c14e;animation:xpup 1.3s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-10px) scale(1.25)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
.btn:active,.chip:active{transform:scale(.95)}
.btn,.chip{transition:transform .08s}
.bubble svg{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pick{animation:pickin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pickin{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.quest.done .pbar i{background:linear-gradient(90deg,#1f8a5b,#5fd39c,#1f8a5b);background-size:200% 100%;animation:shine 2s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.badge.on .ic{animation:bump 1.2s ease-out 1}
@media (prefers-reduced-motion:reduce){.flash,#fxc{display:none}.shake,.bump,.bubble svg,.pick,.quest.done .pbar i,.badge.on .ic,.xpfloat{animation:none!important}}
</style>
</head>
<body>
<header class="top">

function regionList(r,g){return DB.filter(e=>e.r===r&&(!g||e.g===g));}

function recommend(o){
  const out=[];
  regionList(o.r,o.g).forEach(e=>{
    let s=0,why='';
    if(o.kw){const t=stxt(e);const h=o.kw.filter(k=>t.includes(k));if(!h.length)return;s+=h.length*2;why=h.slice(0,2).join('·');}
    if(o.sit){const x=sitScore(e,o.sit);if(!x)return;s+=x.s;why=x.why;}
    if(o.max){const p=minPrice(e);if(p===null||p>o.max)return;}
    s+=(e.t.includes('B')?1:0)+(e.t.includes('A')?.5:0)+(e.t.includes('G')?.5:0)+(e.m.length?.3:0)+ratingBonus(e)+jitter(skey(e));

  });

}

function fillGun(){
  const gs=[...(GUN[ST.ex.r]||[])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));
  $('#ex-gun').innerHTML='<option value="">전체 시군구</option>'+gs.map(s=>`<option>${esc(s)}</option>`).join('');
  $('#ex-gun').value=ST.ex.g||'';
}
function exFilter(){
  const x=ST.ex,q=x.q.toLowerCase();
  let a=[];
  regionList(x.r,x.g).forEach(e=>{
    if(x.tags.size&&![...x.tags].every(t=>e.t.includes(t)))return;
    if(x.cat&&e.c!==x.cat)return;
    if(x.fav&&!S.fav[skey(e)])return;
    if(x.max){const p=minPrice(e);if(p===null||p>x.max)return;}
    if(q&&!(e.n+' '+e.a+' '+e.m.map(m=>m[0]).join(' ')).toLowerCase().includes(q))return;
    let s=0,why='';
    if(x.sit){const r=sitScore(e,x.sit);if(!r)return;s=r.s;why=r.why;}
    s+=(e.t.length)+(e.m.length?.3:0)+ratingBonus(e)+jitter(skey(e));
    a.push({e,s,why});
  });
  if(x.sort==='price')a.sort((p,q)=>(minPrice(p.e)??1e9)-(minPrice(q.e)??1e9));
  else if(x.sort==='name')a.sort((p,q)=>p.e.n.localeCompare(q.e.n,'ko'));
  else a.sort((p,q)=>q.s-p.s);
  return a;
}

function pickDaily(day){
  let h=hashStr(day);const pool=DAILY.slice(),out=[];
  while(out.length<4){h=(Math.imul(h,1103515245)+12345)>>>0;out.push(pool.splice(h%pool.length,1)[0]);}
  if(tripOn(day))out[3]=TRIPQ;
  return out;
}
function questSet(){
  const day=ymd(),ws=weekStart(),dl=S.log.filter(l=>l.d===day),wl=S.log.filter(l=>l.d>=ws);
  return [...pickDaily(day).map(q=>({q,scope:'일일',key:q.id+'@'+day,p:q.c(dl,day)})),
    ...WEEKLY.map(q=>({q,scope:'주간',key:q.id+'@'+ws,p:q.c(wl,ws)})),
    ...CAREER.map(q=>({q,scope:'경력',key:q.id,p:q.c(S.log)}))];
}
function xpTotal(){
  let x=S.log.length*10+S.myRevs.reduce((a,r)=>a+20+(r.photo?20:0),0);
  const all=[...DAILY,TRIPQ,...WEEKLY,...CAREER];
  Object.keys(S.claimed).forEach(k=>{const q=all.find(z=>z.id===k.split('@')[0]);if(q)x+=q.xp;});
  return x;
}

const WALIAS={'돈가스':['돈가스','돈까스','카츠'],'돈까스':['돈까스','돈가스','카츠'],'짜장면':['짜장','자장'],'김치찌개':['김치찌개'],'쌀국수':['쌀국수'],'햄버거':['버거']};
let WROT=0,WSPIN=false;
function wstate(){if(!S.wheel||!Array.isArray(S.wheel.items))S.wheel={items:WDEF.map(([n,c])=>({n,c})),cat:'',skip:true};return S.wheel;}
function wdisliked(n){return (S.prefs.dislikes||[]).find(d=>d&&n.includes(d))||'';}
function wpool(){const w=wstate();return w.items.filter(it=>(!w.cat||it.c===w.cat)&&!(w.skip&&wdisliked(it.n)));}
function wheelSVG(items){
  const N=items.length,R=140,cx=150,cy=150;if(N<2)return '';
  const a=2*Math.PI/N,pt=t=>[cx+R*Math.sin(t),cy-R*Math.cos(t)];
  return `<svg viewBox="0 0 300 300" class="wsvg" role="img" aria-label="메뉴 ${N}개가 배치된 원형 룰렛"><g id="wrot" style="transform:rotate(${WROT}deg)">${items.map((it,i)=>{
    const [x1,y1]=pt(i*a),[x2,y2]=pt((i+1)*a),mid=(i+.5)*a*180/Math.PI,col=WCOL[i%WCOL.length],dark=/^#(1e|0b|3f|1f|6a|e8)/.test(col);
    const fs=N>14?11:N>10?13:15,lab=it.n.length>6?it.n.slice(0,6)+'…':it.n;
    return `<path d="M${cx} ${cy}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${col}" stroke="#fff" stroke-width="2"/><text transform="rotate(${(mid>90&&mid<270)?mid+180:mid} ${cx} ${cy})" x="${cx}" y="${(mid>90&&mid<270)?cy+R-22:cy-R+30}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${dark?'#fff':'#0b2a5b'}" style="writing-mode:horizontal-tb">${esc(lab)}</text>`;}).join('')}</g>
   <circle cx="150" cy="150" r="143" fill="none" stroke="#0b2a5b" stroke-width="5"/><circle cx="150" cy="150" r="30" fill="#fff" stroke="#0b2a5b" stroke-width="4"/></svg>`;}
function renderWheel(){
  const root=$('#p-wheel');if(!root)return;const w=wstate(),pool=wpool();
  const cats=['',...WCATS].filter(c=>!c||w.items.some(it=>it.c===c));
  const skipped=w.items.filter(it=>(!w.cat||it.c===w.cat)&&wdisliked(it.n));
  root.innerHTML=`<div class="bubble">${skinSVG(curSkin(),40)}<div><div class="who">맛삐</div><div class="msg">고민될 땐 돌려 보세요! 나온 메뉴를 파는 <b>세종 착한가격·안심식당</b>까지 바로 찾아 드려요.</div></div></div>
   <div class="row" style="margin-bottom:10px" role="group" aria-label="종류">${cats.map(c=>`<button class="chip" data-act="wcat" data-v="${c}" aria-pressed="${w.cat===c}">${c||'전체'}</button>`).join('')}</div>
   <div class="wbox"><div class="wptr" aria-hidden="true"></div>${pool.length>=2?wheelSVG(pool):'<div class="card empty">메뉴가 2개 이상 있어야 돌릴 수 있어요. 아래에서 추가해 주세요.</div>'}
    <button class="wgo" data-act="wspin" ${pool.length<2?'disabled':''} aria-label="룰렛 돌리기">${skinSVG(curSkin(),46)}<b>돌리기</b></button></div>
   <div class="ctr" style="margin:8px 0 2px;font-size:12.5px;color:var(--mute)">${w.cat||'전체'} ${pool.length}개 메뉴${skipped.length?` · 기피 음식 ${skipped.length}개 제외`:''}</div>
   ${(S.prefs.dislikes||[]).length?`<label class="wsk"><input type="checkbox" data-act="wskip" ${w.skip?'checked':''}> 내 입맛의 싫어하는 음식(${esc(S.prefs.dislikes.join(', '))})이 들어간 메뉴는 빼고 돌리기</label>`:''}
   <div class="sec">메뉴판 편집 <small>이 기기 브라우저에만 저장됩니다</small></div>
   <div class="card"><div class="row2 wrow"><input id="wIn" maxlength="10" placeholder="예: 순대국" aria-label="추가할 메뉴"><select id="wCat" aria-label="종류">${WCATS.map(c=>`<option ${c===(w.cat||'한식')?'selected':''}>${c}</option>`).join('')}</select><button class="btn pri sm" data-act="wadd">추가</button></div>
    <div class="wlist">${w.items.map((it,i)=>`<span class="wit ${wdisliked(it.n)?'bad':''}">${esc(it.n)} <small>${esc(it.c)}</small><button data-act="wdel" data-i="${i}" aria-label="${esc(it.n)} 삭제">×</button></span>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="wreset">기본 메뉴 12개로 되돌리기</button></div></div>`;
  const inp=$('#wIn');if(inp)inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();wAdd();}};
}
function wAdd(){const n=($('#wIn').value||'').trim().replace(/[<>]/g,''),c=$('#wCat').value,w=wstate();
  if(!n){toast('메뉴 이름을 입력해 주세요.');return;}if(w.items.some(it=>it.n===n)){toast('이미 있는 메뉴입니다.');return;}
  if(w.items.length>=24){toast('메뉴는 24개까지 넣을 수 있어요.');return;}
  w.items.push({n,c});save();FX.sfx('coin');renderWheel();toast('「'+n+'」를 룰렛에 추가했습니다.');}
function wMatch(n){const terms=WALIAS[n]||[n];const sej=DB.filter(e=>e.r==='세종');let best={t:n,c:0};
  terms.forEach(t=>{const c=sej.filter(e=>(e.n+' '+e.m.map(m=>m[0]).join(' ')).includes(t)).length;if(c>best.c)best={t,c};});return best;}
function wCameo(n){if(/돈가스|돈까스|카츠/.test(n))return 'katsu';if(/김밥/.test(n))return 'gimbap';if(/비빔/.test(n))return 'bibim';return curSkin();}
function wSpin(){
  if(WSPIN)return;const pool=wpool();if(pool.length<2)return;WSPIN=true;
  const N=pool.length,i=Math.floor(Math.random()*N),a=360/N,target=360-(i*a+a/2)+(Math.random()-.5)*a*.6;
  WROT=WROT+360*5+((target-WROT%360)+720)%360;
  const g=$('#wrot'),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?600:3000;
  g.style.transition=`transform ${dur}ms cubic-bezier(.17,.67,.12,1)`;g.style.transform=`rotate(${WROT}deg)`;
  FX.sfx('tap');let k=0;const tick=setInterval(()=>{if(++k<10)FX.sfx('tap');else clearInterval(tick);},dur/12);
  setTimeout(()=>{WSPIN=false;wResult(pool[i]);},dur+150);
}
function wResult(it){
  const m=wMatch(it.n),bad=wdisliked(it.n);
  $('#qbox').innerHTML=`<button class="x" data-act="qclose" aria-label="닫기">×</button><span class="mscot" style="float:right;margin:-4px 28px 0 0">${skinSVG(wCameo(it.n),64)}</span><span class="tag">[ 룰렛 결과 ]</span>
   <div class="ph" style="margin-top:8px">${esc(it.c)} · 오늘의 메뉴는</div><div class="pickname wbig">${esc(it.n)}</div>
   <div class="ln">${m.c?`세종 착한가격·안심식당·백년가게 중 <b>${m.c}곳</b>에서 「${esc(m.t)}」를 팔아요.`:'세종 인증 업소 목록에서는 이 메뉴를 찾지 못했어요. 맛집 찾기에서 다른 이름으로 검색해 보세요.'}</div>
   ${bad?`<div><span class="hit warn">⚠️ 싫어하는 「${esc(bad)}」 포함</span></div>`:''}
   <div class="bt" style="margin-top:12px"><button class="y" data-act="wfind" data-v="${esc(m.t)}" ${m.c?'':'disabled'}>파는 식당 보기</button><button data-act="wspin2">🎯 다시 돌리기</button></div>`;
  $('#qwin').classList.add('on');if(bad){FX.sfx('oops');FX.shake();say('dislike',400);}else{FX.celebrate('win');const wi=VMENU.indexOf(it.n);say(wi>=0?'w'+wi:'wheel',300);}
}

const skinIdx=k=>Math.max(0,SKINS.findIndex(s=>s.k===k));
function skinSVG(k,size){return (SKIN_SVG[k]||SKIN_SVG.base).replace('width="100" height="100"','width="'+size+'" height="'+size+'"');}
function skinUnlocked(i){return rankOf(xpTotal())>=i;}
function curSkin(){const k=S.skin||'base';return skinUnlocked(skinIdx(k))?k:'base';}
function applySkin(){const el=document.querySelector('.brand>svg,.brand>.hdrm');if(!el)return;const w=document.createElement('span');w.className='hdrm';w.title=SKINS[skinIdx(curSkin())].n;w.innerHTML=skinSVG(curSkin(),50);el.replaceWith(w);}
function cameo(){
  const t=ymd();if(tripOn(t)&&skinUnlocked(2))return {k:'trip',why:'출장 모드'};
  let txt='';try{const mn=menuFor(t,autoMeal());txt=mn?mn.slots.map(s=>s.d.join(' ')).join(' '):'';}catch(e){}
  if(/돈까스|돈가스|카츠/.test(txt))return {k:'katsu',why:'오늘 돈까스 출현'};
  if(/김밥/.test(txt))return {k:'gimbap',why:'오늘 김밥 출현'};
  if(/비빔/.test(txt))return {k:'bibim',why:'오늘 비빔밥 출현'};
  return {k:curSkin(),why:''};}

      <div class="acts"><button class="btn ghost sm" data-act="like" data-id="${esc(r.id)}" aria-pressed="${iLiked(r.id)}">${iLiked(r.id)?'👍 공감함':'👍 공감'} ${likeCount(r.id)}</button></div></article>`;}).join(''):'<div class="card empty" style="grid-column:1/-1">아직 후기가 없습니다. 맛집 카드의 <b>후기·사진</b> 버튼으로 첫 후기를 남겨 보세요.</div>'}</div>`;

  const box=$('#rvBox');
  box.innerHTML=`<div class="sec" style="margin-top:0">${esc(e.n)} <small>후기·인증샷</small></div>
   <div class="stars" id="rvStars" role="radiogroup" aria-label="별점">${[1,2,3,4,5].map(i=>`<button data-act="star" data-v="${i}" class="on" aria-label="${i}점">★</button>`).join('')}</div>

   <textarea id="rvText" rows="3" maxlength="120" placeholder="한줄 후기 (120자 이내) — 메뉴, 분위기, 팁을 알려주세요"></textarea>

   <img id="rvPrev" class="thumb" style="margin-top:8px;display:none" alt="미리보기">
   <p class="addr" style="margin:8px 0 0">사진에는 얼굴·명찰·문서 등 개인정보가 보이지 않게 해주세요. 후기 작성 시 +20 XP, 사진 포함 시 +40 XP.</p>
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="rvclose">닫기</button><button class="btn pri" data-act="rvsubmit" id="rvSub">등록</button></div>`;
  $('#rvDlg').classList.add('on');
  $('#rvFile').onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;

    catch(er){toast('이미지를 불러오지 못했습니다.');}
  };

function resizeImage(file,max,q){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',q);};
  img.onerror=()=>rej(new Error('img'));img.src=url;});}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function submitReview(){
  const d=rvDraft;if(!d)return;
  const btn=$('#rvSub');btn.disabled=true;
  const e=d.e,id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const nick=$('#rvNick').value.trim();S.nick=nick;
  const obj={id,k:skey(e),n:e.n,r:e.r,rating:d.rating,text:$('#rvText').value.trim(),tags:[...d.tags],nick,uid:UID,ts:Date.now(),photo:''};
  let hasPhoto=false;
  if(d.blob){
    try{
      if(ASSETS){const up=await ASSETS.upload(d.blob);obj.photo=(up&&up.url)||('/_blob/'+up.id);hasPhoto=true;}
    }catch(er){obj.photo='';}
    if(!obj.photo){
      try{const small=await resizeImage(d.blob,360,.6);S.photos[id]=await blobToDataURL(small);hasPhoto=true;toast('사진은 이 기기에만 저장됩니다.');}catch(er){}
    }
  }
  if(!obj.text&&!hasPhoto&&!d.tags.size&&d.rating===5&&false){}
  S.reviews.push(obj);S.myRevs.push({id,d:ymd(),photo:hasPhoto});save();
  if(DBH){try{await DBH.collection('reviews').doc(id).set(obj);}catch(er){toast('공유 저장에 실패해 이 기기에만 저장했어요.');}}
  $('#rvDlg').classList.remove('on');rvDraft=null;
  toast(hasPhoto?'후기+사진 등록! +40 XP':'후기 등록! +20 XP');FX.celebrate(hasPhoto?'photo':'review');
  refreshAll();
}
async function toggleLike(id){
  if(S.likes[id]){delete S.likes[id];save();if(DBH){try{await DBH.collection('likes').doc(id+'_'+UID).delete();}catch(er){}}}
  else{S.likes[id]=1;FX.sfx('pop');save();if(DBH){try{await DBH.collection('likes').doc(id+'_'+UID).set({rid:id,uid:UID,ts:Date.now()});}catch(er){}}}
  renderReviews();
}

const PALIAS={'돈까스':['돈까스','돈가스','까스','커틀릿'],'라면':['라면','라멘'],'짜장':['짜장','자장'],'탕수육':['탕수'],'매운맛':['매운','얼큰','마라','청양','불닭','핫','화끈','불맛'],'마라':['마라'],'국물':['국','탕','찌개','전골'],'닭고기':['닭','치킨','찜닭','닭갈비','삼계'],'돼지고기':['돈육','제육','삼겹','돼지','돈','수육','보쌈'],'소고기':['소고기','불고기','한우','우삼','우육','차돌','쇠고기'],'생선':['생선','고등어','갈치','조기','가자미','연어','명태','동태','코다리','북어','황태'],'해산물':['해물','새우','오징어','낙지','주꾸미','조개','바지락','어묵'],'내장':['내장','곱창','순대','막창','선지','양대창'],'버섯':['버섯','느타리','표고','팽이'],'가지':['가지'],'오이':['오이'],'고수':['고수'],'파스타':['파스타','스파게티','리조또','뇨끼'],'면':['면','국수','우동','라면','짬뽕','소바','냉면']};
const termWords=k=>{k=String(k).trim();const a=PALIAS[k];return a?a:[k];};
const PSUG_L=['돈까스','칼국수','제육','치킨','비빔밥','찌개','짜장','파스타'];
const PSUG_D=['오이','고수','마라','내장','가지','버섯','생선','매운맛'];
const normP=t=>t.replace(/\s+/g,'');
function prefHits(list,text){return list.filter(k=>termWords(k).some(w=>text.includes(w)));}
const slotText=sl=>cleanDish(sl.d.join(' '));
function bldEval(b,date,meal){
  const mn=menuFor(date,meal,b);if(!mn||!mn.slots.length)return null;
  const L=S.prefs.likes,D=S.prefs.dislikes;
  const slots=mn.slots.map(sl=>{const t=slotText(sl);const lh=prefHits(L,t),dh=prefHits(D,t);const ex=lh.filter(k=>t.includes(k));return {sl,lh,ex,dh,sc:ex.length*3+(lh.length-ex.length)*2-dh.length*6};});
  const best=slots.slice().sort((a,b)=>b.sc-a.sc||(a.sl.p||0)-(b.sl.p||0))[0];
  const allBad=slots.every(x=>x.dh.length);
  const likeSlots=slots.filter(x=>x.lh.length).length;
  const warnOthers=slots.filter(x=>x!==best&&x.dh.length).length;
  return {b,mn,slots,best,score:best.sc+likeSlots*0.5-(allBad?3:0),allBad,warnOthers};
}
function drawWeights(evs){return evs.map(e=>Math.exp(Math.max(-6,Math.min(8,e.score))/1.3)*(e.allBad?0.05:1));}
function pickBld(evs){
  const w=drawWeights(evs),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<evs.length;i++){r-=w[i];if(r<=0)return evs[i];}return evs[evs.length-1];
}
const prefMark=text=>{const lh=prefHits(S.prefs.likes,text),dh=prefHits(S.prefs.dislikes,text);return (lh.length?`<span class="mk" title="${esc(lh.join(', '))}">❤️</span>`:'')+(dh.length?`<span class="mk" title="${esc(dh.join(', '))}">⚠️</span>`:'');};
function prefCard(){
  const L=S.prefs.likes,D=S.prefs.dislikes;
  const chips=(arr,k)=>arr.map(x=>`<span class="pc ${k}">${esc(x)}<button data-act="prefdel" data-k="${k}" data-v="${esc(x)}" aria-label="${esc(x)} 삭제">×</button></span>`).join('');
  const sg=(arr,sel,k)=>arr.filter(x=>!sel.includes(x)).slice(0,8).map(x=>`<button class="sg" data-act="prefadd" data-k="${k}" data-v="${esc(x)}">+ ${esc(x)}</button>`).join('');
  return `<div class="card pf"><div style="font-weight:800;color:var(--navy)">🎯 내 입맛 설정 <small style="font-weight:400;color:var(--mute)">· 이 기기에만 저장 · 메뉴 이름에 드러난 재료만 판별합니다</small></div>
   <div><h4>❤️ 좋아하는 음식</h4><div class="row2">${chips(L,'l')||'<span style="font-size:12.5px;color:var(--mute)">아직 없어요</span>'}</div>
     <div class="row2" style="margin-top:6px"><input id="pfL" maxlength="10" placeholder="예: 돈까스" data-pin="l"><button class="btn pri sm" data-act="prefadd" data-k="l">추가</button></div><div class="row2" style="margin-top:6px">${sg(PSUG_L,L,'l')}</div></div>
   <div><h4>🚫 싫어하는 음식</h4><div class="row2">${chips(D,'d')||'<span style="font-size:12.5px;color:var(--mute)">아직 없어요</span>'}</div>
     <div class="row2" style="margin-top:6px"><input id="pfD" maxlength="10" placeholder="예: 오이" data-pin="d"><button class="btn pri sm" data-act="prefadd" data-k="d">추가</button></div><div class="row2" style="margin-top:6px">${sg(PSUG_D,D,'d')}</div></div></div>`;
}

function drawOpen(){
  if(DRAW_BUSY||!MENU||!OTH)return;
  const date=ST.date,meal=ST.meal;

  const win=pickBld(evs);

  if(reduce){fin();return;}
  DRAW_BUSY=true;
  box.innerHTML=`<span class="tag">[ 구내식당 추첨 중 ]</span><h2>${md(date)} ${MNAME[meal]} · 오늘의 한 곳</h2>
   <div class="ph">❤️ ${esc(S.prefs.likes.join(' · ')||'취향 미입력')} &nbsp; 🚫 ${esc(S.prefs.dislikes.join(' · ')||'없음')}</div>
   <div class="reel spin" id="reel">?</div><div class="ph" id="rph">후보 ${evs.length}곳 분석 중…</div>`;
  FX.sfx('rank');
  const seq=[];const total=24;for(let i=0;i<total;i++){seq.push(i<total-1?evs[(i*7+3)%evs.length]:win);}
  let i=0;
  const step=()=>{
    const e=seq[i];const el=$('#reel');if(!el){DRAW_BUSY=false;return;}
    el.textContent=bldName(e.b);FX.sfx('tick',i%12);
    if(i%6===5)$('#rph').textContent=['취향 대조 중…','기피 음식 걸러내는 중…','메뉴 점수 계산 중…','거의 다 왔습니다…'][Math.min(3,Math.floor(i/6))];
    i++;
    if(i>=total){el.classList.remove('spin');DRAW_BUSY=false;setTimeout(fin,350);return;}
    setTimeout(step,45+Math.pow(i/total,3)*520);
  };
  step();
}
function drawReveal(e,evs){
  const sl=e.best.sl,tx=slotText(sl);
  const rank=evs.slice().sort((a,b)=>b.score-a.score).findIndex(x=>x.b===e.b)+1;
  const hits=e.best.lh.map(k=>`<span class="hit">❤️ ${esc(k)}${e.best.ex.includes(k)?'':' 계열'}</span>`).join('');
  const warn=e.best.dh.map(k=>`<span class="hit warn">⚠️ ${esc(k)} 포함</span>`).join('');
  const none=(!hits&&!warn)?`<span class="hit no">${S.prefs.likes.length?'좋아하는 음식은 없지만 ':''}기피 음식도 없어요</span>`:'';
  const safe=(!warn&&S.prefs.dislikes.length)?`<span class="hit no">🚫 기피 음식 없음(메뉴명 기준)</span>`:'';
  const ref=e.mn.src==='ref';
  const others=e.slots.filter(x=>x!==e.best).map(x=>`<div class="rw"><span>· ${esc(x.sl.k)} ${esc(cleanDish(x.sl.d[0]))}${x.dh.length?' ⚠️':''}${x.lh.length?' ❤️':''}</span><span>${x.sl.p?won(x.sl.p):''}</span></div>`).join('');
  $('#qbox').innerHTML=`<button class="x" data-act="qclose" aria-label="닫기">×</button><span class="mscot" style="float:right;margin:-4px 28px 0 0">${mascot(e.best.dh.length?"sad":"wow",54)}</span><span class="tag">[ 추첨 결과 ]</span>
   <div class="ph" style="margin-top:8px">${md(ST.date)} ${MNAME[ST.meal]} · 후보 ${evs.length}곳 중 취향 적합도 ${rank}위</div>
   <div class="pickname">${esc(bldName(e.b))}${e.b===S.bld?' (내 식당)':''}</div>
   <div class="ln"><b>${esc(sl.k)}</b> ${sl.p?'· '+won(sl.p):''}<br>${esc(cleanDish(sl.d[0]))}${sl.d[1]?' · '+esc(cleanDish(sl.d.slice(1,4).join(' · '))):''}</div>
   <div>${hits}${warn}${safe}${none}</div>
   ${others?`<div class="box"><div class="rw"><span>이 식당의 다른 코스</span><span></span></div>${others}</div>`:''}
   ${ref?`<div class="ln" style="font-size:12px;color:#9fd8ff">※ ${md(e.mn.ref)} 주 식단 기준 참고용입니다. 방문 전 게시판 확인!</div>`:''}
   <div class="bt" style="margin-top:10px"><button class="y" data-act="drawgo" data-v="${e.b}">여기로 갈래요</button><button data-act="drawagain">🎰 다시 뽑기</button></div>`;
  if(e.best.dh.length){FX.sfx('oops');FX.shake();FX.flash('#ff8a7a');say('dislike',500);}else{FX.celebrate('win');say('draw',500);}
  if(e.best.lh.length)setTimeout(()=>FX.celebrate('quest'),500);
}

function voteTally(){
  const t={};const add=(k,v)=>{const o=t[k]=t[k]||{lg:0,bd:0};if(v>0)o.lg++;else if(v<0)o.bd++;};
  const seen=new Set();

  Object.entries(S.votes||{}).forEach(([k,v])=>{if(!seen.has(UID+'|'+k))add(k,v);});
  if(S.demo){voteCands().forEach(({k,n})=>{const h=hashStr('v'+k);const o=t[k]=t[k]||{lg:0,bd:0};o.lg+=(h%13)+Math.round(n/2);o.bd+=((h>>5)%11);});

}
